<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>稼働状況 - 名護商工軽音部</title>
<style>
:root {
  --main-blue: #00a0e9;
  --sky-blue: #e1f5fe;
  --hibiscus-pink: #ff4081;
  --bg-color: #f0f9ff;
  --card-bg: #ffffff;
  --text-main: #333333;
  --in-color: #2ecc71;
  --out-color: #ff4081;
  --carry-color: #ffa000;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  margin: 0; padding: 10px;
}

.dashboard { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat-box {
  background: var(--card-bg); padding: 12px 2px; border-radius: 12px;
  text-align: center; border-bottom: 4px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.stat-num { font-size: 1.6rem; font-weight: bold; display: block; margin-bottom: 4px; }
.stat-label { font-size: 0.65rem; color: #666; font-weight: bold; }
.stat-in { border-color: var(--in-color); }
.stat-out { border-color: var(--out-color); }
.stat-carry { border-color: var(--carry-color); }

.live-clock-container {
  text-align: center; padding: 15px 0; background: linear-gradient(135deg, var(--main-blue), #00d2ff);
  margin-bottom: 15px; border-radius: 15px; color: white; box-shadow: 0 4px 12px rgba(0,160,233,0.2);
}
#liveClock { font-size: 2.2rem; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
#liveDate { font-size: 0.8rem; opacity: 0.9; margin-bottom: 2px; }

.gear-list { display: flex; flex-direction: column; gap: 8px; }
.gear-row {
  background: var(--card-bg); padding: 12px 15px; border-radius: 10px;
  display: flex; justify-content: space-between; align-items: center;
  border-left: 5px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.03);
}
.gear-row.in { border-left-color: var(--in-color); }
.gear-row.out { border-left-color: var(--out-color); }
.gear-row.carry { border-left-color: var(--carry-color); }
.gear-info { display: flex; flex-direction: column; }
.gear-name { font-size: 0.95rem; font-weight: bold; color: #333; }
.gear-id { font-size: 0.7rem; color: var(--main-blue); font-family: monospace; font-weight: bold; }
.status-label { font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 4px; }
.in .status-label { color: var(--in-color); background: #e8f5e9; }
.out .status-label { color: var(--out-color); background: #ffebee; }
.carry .status-label { color: var(--carry-color); background: #fff3e0; }

.refresh-btn {
  position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 28px;
  background: var(--hibiscus-pink); border: none; font-size: 1.5rem; cursor: pointer;
  box-shadow: 0 4px 15px rgba(255,64,129,0.4); display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>

<div style="font-size: 0.7rem; color: var(--main-blue); font-weight: bold; text-align: center; margin-bottom: 8px;">
  NAGO SHOKO ROCK SYSTEM - 稼働状況
</div>

<div class="dashboard">
  <div class="stat-box stat-in"><span id="inNum" class="stat-num" style="color:var(--in-color)">-</span><span class="stat-label">部室内</span></div>
  <div class="stat-box stat-out"><span id="outNum" class="stat-num" style="color:var(--out-color)">-</span><span class="stat-label">貸出中</span></div>
  <div class="stat-box stat-carry"><span id="carryNum" class="stat-num" style="color:var(--carry-color)">-</span><span class="stat-label">持ち帰り</span></div>
</div>

<div class="live-clock-container">
  <div id="liveDate">----/--/--</div>
  <div id="liveClock">00:00:00</div>
</div>

<div id="gearList" class="gear-list">
  <p style="text-align:center; color:#999; font-size: 0.8rem;">システム照会中...</p>
</div>

<button class="refresh-btn" onclick="loadStatus()">🔄</button>

<script>
/* ★最重要：あなたのGASのWebアプリURLに書き換えてください */
const GAS_API_URL = "https://script.google.com/macros/s/XXXXXX_YOUR_GAS_ID_XXXXXX/exec";

function updateClock() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const h = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  const sec = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('liveDate').textContent = `${y}/${m}/${d}`;
  document.getElementById('liveClock').textContent = `${h}:${min}:${sec}`;
}
setInterval(updateClock, 1000);
updateClock();

async function loadStatus() {
  const list = document.getElementById('gearList');
  
  try {
    // パスワード（passパラメータ）を付けずに、action=stock だけでリクエストする
    const response = await fetch(`${GAS_API_URL}?action=stock`);
    const r = await response.json();
    
    if(!r || !r.ok) {
      list.innerHTML = `<p style="text-align:center; color:red; font-size: 0.8rem;">データ取得失敗</p>`;
      return;
    }
    
    document.getElementById('inNum').textContent = r.total - (r.outCount + r.carryCount);
    document.getElementById('outNum').textContent = r.outCount;
    document.getElementById('carryNum').textContent = r.carryCount;

    if(r.rows.length === 0) {
      list.innerHTML = `<p style="text-align:center; color:#999; font-size: 0.8rem;">登録されている機材はありません</p>`;
      return;
    }

    list.innerHTML = r.rows.map(x => {
      let cls = 'in', statusText = '部室内';
      if(x.status.includes('貸出')) { cls = 'out'; statusText = '貸出中'; } 
      else if(x.status.includes('持ち帰り')) { cls = 'carry'; statusText = '持帰中'; }

      return `
        <div class="gear-row ${cls}">
          <div class="gear-info">
            <span class="gear-id">${escapeHtml(x.id)}</span>
            <span class="gear-name">${escapeHtml(x.name)}</span>
          </div>
          <span class="status-label">${statusText}</span>
        </div>
      `;
    }).join("");

  } catch (e) {
    list.innerHTML = `<p style="text-align:center; color:red; font-size: 0.8rem;">通信エラー</p>`;
  }
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

window.onload = loadStatus;
</script>
</body>
</html>
