<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>機材管理システム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>機材貸出フォーム</h1>

  <input type="text" id="name" placeholder="氏名">
  <input type="text" id="ids" placeholder="管理番号">
  <input type="text" id="use" placeholder="用途">
  <input type="text" id="checker" placeholder="確認者ID">

  <select id="type">
    <option value="貸出">貸出</option>
    <option value="返却">返却</option>
    <option value="持ち帰り">持ち帰り</option>
  </select>

  <button onclick="submitLog()">送信</button>

  <p id="result"></p>
</div>

<script src="app.js"></script>
</body>
</html>
